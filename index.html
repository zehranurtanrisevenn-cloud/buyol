<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUYOL - YKS Takip Sistemi</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #F4F7FB;
      --card-bg: #FFFFFF;
      --bu-navy: #002855;
      --bu-blue: #0072CE;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --success: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.1;
    }
    .brand-bu { color: var(--bu-navy); }
    .brand-yol { color: var(--bu-blue); }
    
    .brand-sub {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 6px;
      font-weight: 500;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 24px;
    }
    @media (max-width: 992px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 40, 85, 0.05);
      border: 1px solid #E2E8F0;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: var(--bu-navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 1.5px solid #F1F5F9;
    }

    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #334155;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      background: #fff;
    }
    input:focus, select:focus {
      border-color: var(--bu-blue);
      box-shadow: 0 0 0 3px rgba(0, 114, 206, 0.15);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--bu-navy), var(--bu-blue));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      padding: 11px;
      background: #EEF2F6;
      color: var(--bu-navy);
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .btn-secondary:hover { background: #E2E8F0; }

    .btn-fetch {
      padding: 9px 14px;
      background: #0072CE;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-fetch:hover { background: #005bb5; }

    .chart-container {
      position: relative;
      height: 480px;
      width: 100%;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      padding: 8px 14px;
      border: 1.5px solid #CBD5E1;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: #475569;
    }
    .tab-btn.active {
      background: var(--bu-navy);
      color: white;
      border-color: var(--bu-navy);
    }
    .status-msg {
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    #entrySection {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 2px dashed #E2E8F0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-title"><span class="brand-bu">BU</span><span class="brand-yol">YOL</span></div>
    <div class="brand-sub">Sarıyer Kız AİHL • Haftalık Soru Takip Sistemi</div>
  </div>

  <div class="container">
    <div class="card">
      <h2>1. Hızlı Giriş</h2>
      
      <div class="form-group">
        <label for="classSelect">Sınıfınızı Seçiniz</label>
        <select id="classSelect" required>
          <option value="" disabled selected>Sınıf seçiniz...</option>
          <option value="12-A Proje">12-A Proje (Fen Sosyal)</option>
          <option value="12-B Proje">12-B Proje (Fen Sosyal)</option>
          <option value="12-C">12-C (Sözel)</option>
          <option value="12-D">12-D (Dil)</option>
          <option value="11-A">11-A (Sayısal)</option>
          <option value="11-B Proje">11-B Proje (Eşit Ağırlık)</option>
          <option value="11/C">11/C (Sözel)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="studentSelect">Adınızı Seçiniz</label>
        <select id="studentSelect" disabled required>
          <option value="" disabled selected>Önce sınıf seçiniz...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="studentCode">Özel Öğrenci Kodunuz</label>
        <input type="password" id="studentCode" placeholder="4 haneli kodunuzu giriniz" maxlength="6" disabled>
      </div>

      <button type="button" class="btn-secondary" id="loginBtn" disabled>Sisteme Giriş Yap</button>
      <div class="status-msg" id="statusMsg"></div>

      <!-- Giriş Yapılınca Anında Açılan Form -->
      <div id="entrySection">
        <h2 style="margin-top: 0;">2. Haftalık Soru Girişi</h2>
        <form id="trackForm">
          <div class="form-group">
            <label for="weekSelect">Hafta Seçimi</label>
            <select id="weekSelect" required></select>
          </div>

          <div class="section-title">TYT Çözülen Soru Sayıları</div>
          <div class="grid-2">
            <div class="form-group">
              <label for="tytTurkce">Türkçe</label>
              <input type="number" id="tytTurkce" min="0" placeholder="0" required>
            </div>
            <div class="form-group">
              <label for="tytSosyal">Sosyal</label>
              <input type="number" id="tytSosyal" min="0" placeholder="0" required>
            </div>
            <div class="form-group">
              <label for="tytMat">Matematik</label>
              <input type="number" id="tytMat" min="0" placeholder="0" required>
            </div>
            <div class="form-group">
              <label for="tytFen">Fen</label>
              <input type="number" id="tytFen" min="0" placeholder="0" required>
            </div>
          </div>

          <div class="section-title">AYT / YDT Çözülen Soru Sayıları</div>
          <div class="grid-2">
            <div class="form-group">
              <label for="aytEdebiyat">Edebiyat</label>
              <input type="number" id="aytEdebiyat" min="0" placeholder="0" required>
            </div>
            <div class="form-group">
              <label for="aytSosyal">Sosyal</label>
              <input type="number" id="aytSosyal" min="0" placeholder="0" required>
            </div>
            <div class="form-group">
              <label for="aytMat">Matematik</label>
              <input type="number" id="aytMat" min="0" placeholder="0" required>
            </div>
            <div class="form-group">
              <label for="aytFen">Fen</label>
              <input type="number" id="aytFen" min="0" placeholder="0" required>
            </div>
          </div>
          <div class="form-group">
            <label for="aytDil">YDT / Yabancı Dil</label>
            <input type="number" id="aytDil" min="0" placeholder="0" required>
          </div>

          <button type="submit" class="btn" id="saveBtn">Haftalık Veriyi Kaydet & Grafiğe Ekle</button>
        </form>
      </div>
    </div>

    <!-- Grafik Paneli -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
        <h2 id="chartHeading" style="margin: 0;">Soru Gelişim Grafiği</h2>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button type="button" class="btn-fetch" id="fetchHistoryBtn" style="display: none;">📊 Geçmiş Verilerimi Getir</button>
          <div class="tab-buttons">
            <button class="tab-btn active" id="btnShowTyt">TYT</button>
            <button class="tab-btn" id="btnShowAyt">AYT / YDT</button>
          </div>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="questionChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbxXc4066IINgD63XkiQJgojqAy-_gy4uEMZAiXfJ_o2Qwe38w3pmPqeZigmQQHdquGP/exec";

    const STUDENTS_DATABASE = {
      "12-A Proje": [
        { name: "Duru Ayyıldız", code: "7873" },
        { name: "Zeynep Zümra Ermencu", code: "4611" },
        { name: "Zehra Türk", code: "8359" },
        { name: "Meryem Kocaman", code: "5557" },
        { name: "Nisanur Şengil", code: "1106" },
        { name: "Bera Nur Çakır", code: "3615" },
        { name: "Sena Yüksektaş", code: "7924" },
        { name: "Elif Berra Akça", code: "6574" },
        { name: "İrem Gündoğdu", code: "5552" },
        { name: "İlayda Çetinkaya", code: "3547" },
        { name: "Asude Rana Akbaş", code: "4527" }
      ],
      "12-B Proje": [
        { name: "Zehra Göçlü", code: "6514" },
        { name: "Nisanur Dursun", code: "2674" },
        { name: "Azranur Şenyuva", code: "2519" },
        { name: "Gençra Nitepe", code: "7224" },
        { name: "Aslınur Hatır", code: "2584" },
        { name: "Ecrin Topçu", code: "6881" },
        { name: "Zehra Ulucay", code: "6635" },
        { name: "Hıranur Bulut", code: "5333" },
        { name: "Zeynep Eylül Bedir", code: "1711" },
        { name: "Elif Sene Bedir", code: "8527" }
      ],
      "12-C": [
        { name: "Hatice Demir", code: "2824" },
        { name: "Nurulayn Eleysa Kılıç", code: "1409" },
        { name: "Zeynep Akkuş", code: "5506" },
        { name: "Ayşenur Balı", code: "5012" },
        { name: "Reyyan Tahirmustafa", code: "4657" },
        { name: "Hatice Kübra Karaca", code: "3286" }
      ],
      "12-D": [
        { name: "Zeynep Nur Çayır", code: "6977" },
        { name: "Tuana Şahin", code: "3664" },
        { name: "Nisa Bayrak", code: "7065" },
        { name: "Ümmü G. Yazıcı", code: "6820" }
      ],
      "11-A": [
        { name: "Zeynep Taştemel", code: "2679" },
        { name: "Hazal Alagha", code: "9935" },
        { name: "Zeynep Yaren Satır", code: "2424" },
        { name: "Zeynep Sevde Usanmaz", code: "7912" },
        { name: "Ceylin Temiz", code: "1520" },
        { name: "Bağlem Sarı", code: "1488" },
        { name: "Esma Ahsen Selvi", code: "2535" },
        { name: "Ecrin Gebecik", code: "4582" },
        { name: "Sema Ceren Şerifoğlu", code: "4811" },
        { name: "Esmanur Ünver", code: "9279" },
        { name: "Miray Polat", code: "1434" },
        { name: "Hatice Kübra Akdeniz", code: "4257" },
        { name: "Şevval Girgin", code: "9928" }
      ],
      "11-B Proje": [
        { name: "Afra Hayırmaz", code: "9785" },
        { name: "Melek Betül Ercan", code: "3045" },
        { name: "Semanur Karcı", code: "7201" },
        { name: "Melike Zeynep Taş", code: "2291" },
        { name: "Betül Nisa Çelikkol", code: "5803" },
        { name: "Zeynep Doğan", code: "6925" },
        { name: "Esmanur Kara", code: "4150" },
        { name: "Hayrunnisa Arışhan", code: "2139" },
        { name: "İrem Aluç Öz", code: "1750" },
        { name: "Zeynep Ecrin Aksu", code: "4733" },
        { name: "Zeynep Sena Öztürk", code: "5741" }
      ],
      "11/C": [
        { name: "Melike Bay", code: "2307" },
        { name: "Zeynep Elveren", code: "4814" },
        { name: "Meyyar Yousef", code: "2654" },
        { name: "Ayşe Zeynep Hendem", code: "7227" },
        { name: "Nisa Gökboyacı", code: "5554" },
        { name: "Sevde Zehra Gemici", code: "8428" }
      ]
    };

    const weekSelect = document.getElementById('weekSelect');
    const weeks = [];
    for (let i = 1; i <= 40; i++) {
      const w = `${i}. Hafta`;
      weeks.push(w);
      const opt = document.createElement('option');
      opt.value = w;
      opt.textContent = w;
      weekSelect.appendChild(opt);
    }

    const datasetsTYT = {
      turkce: new Array(40).fill(null),
      sosyal: new Array(40).fill(null),
      mat: new Array(40).fill(null),
      fen: new Array(40).fill(null)
    };

    const datasetsAYT = {
      edebiyat: new Array(40).fill(null),
      sosyal: new Array(40).fill(null),
      mat: new Array(40).fill(null),
      fen: new Array(40).fill(null),
      dil: new Array(40).fill(null)
    };

    let activeTab = 'TYT';

    const pastelColors = {
      turkce: { border: '#60A5FA', bg: 'rgba(96, 165, 250, 0.15)' },
      sosyal: { border: '#F472B6', bg: 'rgba(244, 114, 182, 0.15)' },
      mat: { border: '#34D399', bg: 'rgba(52, 211, 153, 0.15)' },
      fen: { border: '#A78BFA', bg: 'rgba(167, 139, 250, 0.15)' },
      dil: { border: '#FBBF24', bg: 'rgba(251, 191, 36, 0.15)' }
    };

    const ctx = document.getElementById('questionChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { labels: weeks, datasets: [] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 300 },
        tension: 0.35,
        pointRadius: 4,
        pointHoverRadius: 6,
        plugins: { legend: { position: 'top' } },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Soru Sayısı' }, grid: { color: '#F1F5F9' } },
          x: { grid: { display: false } }
        }
      }
    });

    function renderChartData() {
      if (activeTab === 'TYT') {
        chart.data.datasets = [
          { label: 'TYT Türkçe', data: datasetsTYT.turkce, borderColor: pastelColors.turkce.border, backgroundColor: pastelColors.turkce.bg, fill: true },
          { label: 'TYT Sosyal', data: datasetsTYT.sosyal, borderColor: pastelColors.sosyal.border, backgroundColor: pastelColors.sosyal.bg, fill: true },
          { label: 'TYT Mat', data: datasetsTYT.mat, borderColor: pastelColors.mat.border, backgroundColor: pastelColors.mat.bg, fill: true },
          { label: 'TYT Fen', data: datasetsTYT.fen, borderColor: pastelColors.fen.border, backgroundColor: pastelColors.fen.bg, fill: true }
        ];
      } else {
        chart.data.datasets = [
          { label: 'AYT Edebiyat', data: datasetsAYT.edebiyat, borderColor: pastelColors.turkce.border, backgroundColor: pastelColors.turkce.bg, fill: true },
          { label: 'AYT Sosyal', data: datasetsAYT.sosyal, borderColor: pastelColors.sosyal.border, backgroundColor: pastelColors.sosyal.bg, fill: true },
          { label: 'AYT Mat', data: datasetsAYT.mat, borderColor: pastelColors.mat.border, backgroundColor: pastelColors.mat.bg, fill: true },
          { label: 'AYT Fen', data: datasetsAYT.fen, borderColor: pastelColors.fen.border, backgroundColor: pastelColors.fen.bg, fill: true },
          { label: 'AYT / YDT Dil', data: datasetsAYT.dil, borderColor: pastelColors.dil.border, backgroundColor: pastelColors.dil.bg, fill: true }
        ];
      }
      chart.update();
    }

    renderChartData();

    document.getElementById('btnShowTyt').addEventListener('click', function() {
      activeTab = 'TYT';
      this.classList.add('active');
      document.getElementById('btnShowAyt').classList.remove('active');
      renderChartData();
    });

    document.getElementById('btnShowAyt').addEventListener('click', function() {
      activeTab = 'AYT';
      this.classList.add('active');
      document.getElementById('btnShowTyt').classList.remove('active');
      renderChartData();
    });

    const classSelect = document.getElementById('classSelect');
    const studentSelect = document.getElementById('studentSelect');
    const studentCode = document.getElementById('studentCode');
    const loginBtn = document.getElementById('loginBtn');
    const fetchHistoryBtn = document.getElementById('fetchHistoryBtn');
    const entrySection = document.getElementById('entrySection');
    const statusMsg = document.getElementById('statusMsg');

    classSelect.addEventListener('change', function() {
      studentSelect.innerHTML = '<option value="" disabled selected>Adınızı seçiniz...</option>';
      studentSelect.disabled = false;
      studentCode.disabled = true;
      loginBtn.disabled = true;
      studentCode.value = '';
      entrySection.style.display = 'none';
      fetchHistoryBtn.style.display = 'none';

      const students = STUDENTS_DATABASE[this.value] || [];
      students.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = s.name;
        studentSelect.appendChild(opt);
      });
    });

    studentSelect.addEventListener('change', function() {
      studentCode.disabled = false;
      loginBtn.disabled = false;
      studentCode.value = '';
      entrySection.style.display = 'none';
      fetchHistoryBtn.style.display = 'none';
      statusMsg.style.display = 'none';
    });

    // 1. ANINDA GİRİŞ YAPMA (Sıfır Gecikme - Sunucuya Gitmez)
    loginBtn.addEventListener('click', function() {
      const selectedClass = classSelect.value;
      const selectedStudentName = studentSelect.value;
      const enteredCode = studentCode.value.trim();

      const studentObj = (STUDENTS_DATABASE[selectedClass] || []).find(s => s.name === selectedStudentName);

      if (!studentObj || studentObj.code !== enteredCode) {
        statusMsg.style.display = 'block';
        statusMsg.style.color = '#EF4444';
        statusMsg.textContent = 'Hatalı kod! Lütfen size verilen 4 haneli kodu kontrol ediniz.';
        entrySection.style.display = 'none';
        fetchHistoryBtn.style.display = 'none';
        return;
      }

      // Doğrulama tarayıcıda bitti, hemen formu aç!
      statusMsg.style.display = 'block';
      statusMsg.style.color = '#10B981';
      statusMsg.textContent = `✓ Hoş geldin ${selectedStudentName}!`;
      
      entrySection.style.display = 'block';
      fetchHistoryBtn.style.display = 'inline-block';
      document.getElementById('chartHeading').textContent = `${selectedStudentName} (${selectedClass}) - Soru Gelişimi`;
    });

    // 2. İSTEĞE BAĞLI: GEÇMİŞİ YÜKLE BUTONU
    fetchHistoryBtn.addEventListener('click', function() {
      const selectedStudentName = studentSelect.value;
      fetchHistoryBtn.disabled = true;
      fetchHistoryBtn.textContent = 'Yükleniyor...';

      const oldScript = document.getElementById('jsonpScript');
      if (oldScript) oldScript.remove();

      window.handleSheetsResponse = function(response) {
        fetchHistoryBtn.disabled = false;
        fetchHistoryBtn.textContent = '✓ Geçmiş Yüklendi';

        if (response && response.status === 'success' && response.data && response.data.length > 0) {
          // Grafiği temizleyip doldur
          for (let i = 0; i < 40; i++) {
            datasetsTYT.turkce[i] = null; datasetsTYT.sosyal[i] = null;
            datasetsTYT.mat[i] = null; datasetsTYT.fen[i] = null;
            datasetsAYT.edebiyat[i] = null; datasetsAYT.sosyal[i] = null;
            datasetsAYT.mat[i] = null; datasetsAYT.fen[i] = null;
            datasetsAYT.dil[i] = null;
          }

          response.data.forEach(item => {
            const weekIndex = parseInt(item.week) - 1;
            if (weekIndex >= 0 && weekIndex < 40) {
              datasetsTYT.turkce[weekIndex] = item.tytTurkce;
              datasetsTYT.sosyal[weekIndex] = item.tytSosyal;
              datasetsTYT.mat[weekIndex] = item.tytMat;
              datasetsTYT.fen[weekIndex] = item.tytFen;

              datasetsAYT.edebiyat[weekIndex] = item.aytEdebiyat;
              datasetsAYT.sosyal[weekIndex] = item.aytSosyal;
              datasetsAYT.mat[weekIndex] = item.aytMat;
              datasetsAYT.fen[weekIndex] = item.aytFen;
              datasetsAYT.dil[weekIndex] = item.aytDil;
            }
          });

          renderChartData();
          statusMsg.textContent = `✓ ${response.data.length} haftalık geçmiş veriniz yüklendi.`;
        } else {
          statusMsg.textContent = 'Daha önce kaydedilmiş geçmiş veri bulunamadı.';
        }

        const s = document.getElementById('jsonpScript');
        if (s) s.remove();
      };

      const script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = `${GOOGLE_SHEETS_URL}?name=${encodeURIComponent(selectedStudentName)}&callback=handleSheetsResponse`;
      document.body.appendChild(script);
    });

    // 3. ANINDA KAYDETME (Kullanıcı Beklemez)
    document.getElementById('trackForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const selectedClass = classSelect.value;
      const selectedStudentName = studentSelect.value;
      const selectedWeek = weekSelect.value;
      const weekIndex = parseInt(selectedWeek) - 1;

      const tTurkce = parseInt(document.getElementById('tytTurkce').value) || 0;
      const tSosyal = parseInt(document.getElementById('tytSosyal').value) || 0;
      const tMat = parseInt(document.getElementById('tytMat').value) || 0;
      const tFen = parseInt(document.getElementById('tytFen').value) || 0;

      const aEdebiyat = parseInt(document.getElementById('aytEdebiyat').value) || 0;
      const aSosyal = parseInt(document.getElementById('aytSosyal').value) || 0;
      const aMat = parseInt(document.getElementById('aytMat').value) || 0;
      const aFen = parseInt(document.getElementById('aytFen').value) || 0;
      const aDil = parseInt(document.getElementById('aytDil').value) || 0;

      // Grafiği beklemeden anında güncelle
      datasetsTYT.turkce[weekIndex] = tTurkce;
      datasetsTYT.sosyal[weekIndex] = tSosyal;
      datasetsTYT.mat[weekIndex] = tMat;
      datasetsTYT.fen[weekIndex] = tFen;

      datasetsAYT.edebiyat[weekIndex] = aEdebiyat;
      datasetsAYT.sosyal[weekIndex] = aSosyal;
      datasetsAYT.mat[weekIndex] = aMat;
      datasetsAYT.fen[weekIndex] = aFen;
      datasetsAYT.dil[weekIndex] = aDil;

      renderChartData();

      // Kullanıcıya anında bildirim ver
      statusMsg.style.display = 'block';
      statusMsg.style.color = '#10B981';
      statusMsg.textContent = `✓ ${selectedWeek} verileri grafiğe eklendi ve Google E-Tabloya aktarıldı!`;

      // Arka planda sessizce kaydet
      const payload = {
        studentName: selectedStudentName,
        studentClass: selectedClass,
        week: selectedWeek,
        tytTurkce: tTurkce, tytSosyal: tSosyal, tytMat: tMat, tytFen: tFen,
        aytEdebiyat: aEdebiyat, aytSosyal: aSosyal, aytMat: aMat, aytFen: aFen,
        aytDil: aDil
      };

      fetch(GOOGLE_SHEETS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    });
  </script>
</body>
